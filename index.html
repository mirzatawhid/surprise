:root{--pink:#ff78a8;--dark:#91436e;--light:#fff0f6}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;
 font-family:'Hind Siliguri',sans-serif;color:var(--dark);

#app{

.art{font-size:65px;line-height:1.4;margin:8px}
.ribbon{display:inline-block;padding:6px 13px;border-radius:30px;background:var(--light);font-size:12px;margin-bottom:12px}
h1{font-size:clamp(27px,7vw,36px);line-height:1.45;margin:8px 0}
h2{font-size:24px;line-height:1.5;margin:10px 0}
p{font-size:16px;line-height:1.9}
.note{padding:17px;background:#fff4f8;border:1px dashed #ffc0d8;border-radius:19px;margin:18px 0;line-height:1.95}

.progress{height:6px;background:#f7e2ed;border-radius:20px;overflow:hidden;margin-bottom:15px}

.primary{background:linear-gradient(120deg,#ff76a5,#f29ac8);color:white;box-shadow:0 7px 18px #f080ac35}
.secondary{background:#fff0f6;color:#a34c79;border:1px solid #f6cadd}

.footer{font-size:12px;color:#bc91a9;margin-top:22px}

#popup{position:fixed;inset:0;background:#61394d80;z-index:10;display:none;place-items:center;padding:20px}
.popup-card{background:white;width:min(100%,340px);padding:25px;border-radius:28px;text-align:center;box-shadow:0 20px 60px #54243e40}
.kitty{font-size:76px}

html {

  text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  padding: 12px;
  padding-top: max(12px, env(safe-area-inset-top));
  padding-bottom: max(12px, env(safe-area-inset-bottom));
}

#app {
  width: 100%;
  max-width: 490px;
  padding: clamp(20px, 6vw, 30px) clamp(16px, 5vw, 24px);
  border-radius: 26px;
  overflow-wrap: anywhere;
}

button {
  min-height: 50px;
  width: 100%;
  padding: 14px 16px;

}

.buttons {
  gap: 12px;
}

.choice {
  min-height: 56px;
  text-align: left;
}

.art {
  font-size: clamp(48px, 14vw, 68px);
}

h1 {
  font-size: clamp(27px, 7.5vw, 36px);
}

h2 {
  font-size: clamp(21px, 6vw, 25px);
}

p {
  font-size: 16px;
  line-height: 1.85;
  overflow-wrap: anywhere;
}

.note {

}

#popup {
  padding: 16px;

}

.popup-card {

@media (max-width: 360px) {

  }

  }

@media (prefers-reduced-motion: reduce) {

function hearts(n){
 const symbols=["💗","💕","💖","🎀","🌸","🤗"];
 for(let i=0;i<n;i++){
  const el=document.createElement("span");
  el.className="heart";
  el.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  el.style.left=Math.random()*100+"vw";
  el.style.fontSize=(18+Math.random()*22)+"px";
  el.style.animationDelay=Math.random()*1.8+"s";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),4500);
 }
}

start();
</script>
